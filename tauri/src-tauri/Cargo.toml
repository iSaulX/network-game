[package]
name = "parchis-stars"
version = "0.1.0"
description = "Parchís Stars desktop shell"
authors = ["Parchís Stars"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "parchis_stars_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
